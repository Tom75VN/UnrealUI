name: Publish UnrealUI release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: unrealui-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7

      - name: Validate the addon version
        shell: bash
        run: |
          toc_version="$(sed -n 's/^## Version: //p' unrealUI.toc | tr -d '\r')"
          tag_version="${GITHUB_REF_NAME#v}"

          test -n "$toc_version"
          test "$toc_version" = "$tag_version"

      - name: Package UnrealUI
        shell: bash
        run: |
          mkdir -p package/unrealUI

          # Everything the client loads at runtime. Bindings.xml is absent from
          # the .toc because the client loads it from the addon folder itself;
          # locales/ and themes/ are listed in the .toc. A zip missing any of
          # them installs an addon that silently loses those files.
          cp -R core locales media modules themes package/unrealUI/
          cp Bindings.xml unrealUI.toc LICENSE package/unrealUI/

          # Guard against this copy list drifting from the .toc again: every
          # file the .toc lists must exist inside the package.
          missing=0
          for entry in $(sed -e 's/\r$//' -e 's/#.*//' unrealUI.toc | sed 's|\\|/|g'); do
            if [ ! -f "package/unrealUI/$entry" ]; then
              echo "missing from package: $entry"
              missing=1
            fi
          done
          test "$missing" -eq 0

          (
            cd package
            zip -r ../UnrealUI.zip unrealUI
          )

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" UnrealUI.zip \
            --verify-tag \
            --title "UnrealUI ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md \
            --latest
