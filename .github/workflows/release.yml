name: Publish UnrealUI release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: unrealui-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7

      - name: Validate the addon version
        shell: bash
        run: |
          toc_version="$(sed -n 's/^## Version: //p' unrealUI.toc | tr -d '\r')"
          tag_version="${GITHUB_REF_NAME#v}"

          test -n "$toc_version"
          test "$toc_version" = "$tag_version"

      - name: Package UnrealUI
        shell: bash
        run: |
          mkdir -p package/unrealUI
          cp -R core media modules unrealUI.toc package/unrealUI/
          (
            cd package
            zip -r ../UnrealUI.zip unrealUI
          )

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" UnrealUI.zip \
            --verify-tag \
            --title "UnrealUI ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md \
            --latest
